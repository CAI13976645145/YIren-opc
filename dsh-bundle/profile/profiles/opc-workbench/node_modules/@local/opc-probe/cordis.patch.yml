# opc-probe bundle patch layer
# Mounted by the opc-workbench profile through dsh.profile.bundles: this insert
# entry is the composition-level contract that puts the plugin into the cordis
# tree with its config. engines.dsh in package.json pins the runtime to the
# exact locked version (0.2.2-rc.1); the app-boot compatibility gate rejects a
# mismatch instead of loading silently.
- insert:
    - id: opc-probe
      name: '@local/opc-probe'
      config:
        routePath: '/opc-probe/v1/run'
        healthPath: '/opc-probe/v1/health'
        collectMillis: 90000
        settleMillis: 10000
        maxBodyBytes: 65536
