# opc-runtime-bridge bundle patch layer (ADR-0005)
# Mounted by the opc-workbench profile through dsh.profile.bundles: this insert
# entry is the composition-level contract that puts the bridge into the cordis
# tree with its config. engines.dsh in package.json pins the runtime to the
# exact locked version (0.2.2-rc.1); the app-boot compatibility gate rejects a
# mismatch instead of loading silently.
- insert:
    - id: opc-runtime-bridge
      name: '@local/opc-runtime-bridge'
      config:
        routePrefix: '/opc-runtime/v1'
        maxBodyBytes: 262144
        maxFramesPerSession: 2000
