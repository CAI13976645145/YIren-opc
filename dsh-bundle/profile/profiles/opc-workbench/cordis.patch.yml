# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).
#
# opc-workbench profile layer (phase-0 spike):
#   1. LLM provider rows point at the machine-local gateway (same shape as the
#      proven desktop profile; the API key stays in $DSH_HOME/.credentials.yaml).
#   2. webserver binds 127.0.0.1:3081 for this experiment (default 3080 left free).
#   3. web-runtime keeps the browser closed: this profile is driven over HTTP.
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: aa
    model: cn:deepseek-v4.1-flash
