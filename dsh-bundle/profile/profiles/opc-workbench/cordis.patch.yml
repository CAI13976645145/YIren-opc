- id: webserver
  name: '@deepseek-ai/dsh-host-webserver'
  config:
    host: 127.0.0.1
    port: 3081
    compression: gzip
    compressionLevel: 1
    compressionThresholdBytes: 1024
- id: web-runtime
  name: '@deepseek-ai/dsh-web-app'
  config:
    openBrowser: false
    printUrl: true
    surfaceContext: true

# 默认允许所有权限：审批策略 never，不弹 DSH 原生审批。
- id: approval
  name: "@deepseek-ai/dsh-user-approval"
  config:
    policy: never
# danger-full-access = 完整文件访问 + 不询问审批；所有员工默认使用这个预设。
- id: permission
  name: "@deepseek-ai/dsh-permission-presets"
  config:
    defaultPreset: danger-full-access
