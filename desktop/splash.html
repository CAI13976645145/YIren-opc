<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>一人公司</title>
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: grid;
      place-items: center;
      background: #f6f7f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: #1f2430;
      user-select: none;
    }
    .card {
      width: 420px;
      padding: 40px 42px;
      background: #fff;
      border: 1px solid #e8eaf0;
      border-radius: 26px;
      box-shadow: 0 24px 60px rgba(31, 36, 48, .08);
      text-align: center;
    }
    .mark {
      width: 64px; height: 64px; margin: 0 auto 18px;
      border-radius: 18px;
      background: #1f2430;
      color: #fff;
      display: grid; place-items: center;
      font-size: 30px; font-weight: 700;
      letter-spacing: -2px;
    }
    h1 { font-size: 22px; margin: 0 0 6px; letter-spacing: .5px; }
    p { margin: 0; color: #6b7280; font-size: 13px; }
    .bar {
      margin-top: 26px;
      height: 4px;
      border-radius: 999px;
      background: #eef1f6;
      overflow: hidden;
    }
    .bar i {
      display: block;
      width: 40%;
      height: 100%;
      border-radius: 999px;
      background: #2f6bff;
      animation: slide 1.2s ease-in-out infinite;
    }
    @keyframes slide {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(260%); }
    }
    .hint { margin-top: 14px; font-size: 12px; color: #9aa3b2; }
  </style>
</head>
<body>
  <div class="card">
    <div class="mark">一</div>
    <h1>一人公司</h1>
    <p>正在启动本地服务与 AI 运行时…</p>
    <div class="bar"><i></i></div>
    <div class="hint">首次启动需要更久，请稍候</div>
  </div>
</body>
</html>
