<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>一人公司</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">一</div>
        <div class="brand-text">
          <strong>一人公司</strong>
          <span>拾光工作室</span>
        </div>
      </div>

      <button class="new-project" type="button" data-action="new-project">
        <span class="plus">+</span>
        新建项目
      </button>

      <nav class="nav" id="main-nav">
        <button class="nav-item active" type="button" data-view="deliverables">
          <span class="nav-icon" data-icon="file"></span>
          <span>交付物</span>
        </button>
        <button class="nav-item" type="button" data-view="previewdesk">
          <span class="nav-icon" data-icon="preview"></span>
          <span>预览台</span>
          <span class="count" id="preview-count" hidden>0</span>
        </button>
        <button class="nav-item" type="button" data-view="tasks">
          <span class="nav-icon" data-icon="task"></span>
          <span>任务</span>
        </button>
        <button class="nav-item" type="button" data-view="inbox">
          <span class="nav-icon" data-icon="inbox"></span>
          <span>收件箱</span>
          <span class="count" id="decision-count">2</span>
        </button>
        <button class="nav-item" type="button" data-view="projects">
          <span class="nav-icon" data-icon="folder"></span>
          <span>项目</span>
        </button>
        <button class="nav-item" type="button" data-view="employees">
          <span class="nav-icon" data-icon="users"></span>
          <span>员工</span>
        </button>

        <button class="nav-item nav-parent" type="button" data-action="toggle-datacenter" id="datacenter-toggle">
          <span class="nav-icon" data-icon="server"></span>
          <span>机房</span>
          <span class="nav-chevron">⌄</span>
        </button>
        <div class="nav-sub" id="datacenter-sub" hidden></div>

        <button class="nav-item" type="button" data-view="gateway">
          <span class="nav-icon" data-icon="server"></span>
          <span>网关</span>
          <span class="count" id="gateway-nav-count" hidden>0</span>
        </button>

        <button class="nav-item" type="button" data-view="ledger">
          <span class="nav-icon" data-icon="chart"></span>
          <span>账本</span>
        </button>

        <button class="nav-item nav-parent" type="button" data-action="toggle-ops" id="ops-toggle">
          <span class="nav-icon" data-icon="activity"></span>
          <span>运营中心</span>
          <span class="nav-chevron">⌄</span>
        </button>
        <div class="nav-sub" id="ops-sub" hidden>
          <button class="nav-item" type="button" data-view="reports">
            <span class="nav-icon" data-icon="report"></span>
            <span>日报周报</span>
          </button>
          <button class="nav-item" type="button" data-view="meetings">
            <span class="nav-icon" data-icon="meeting"></span>
            <span>会议</span>
          </button>
          <button class="nav-item" type="button" data-view="org">
            <span class="nav-icon" data-icon="org"></span>
            <span>组织绩效</span>
          </button>
          <button class="nav-item" type="button" data-view="teams">
            <span class="nav-icon" data-icon="users"></span>
            <span>团队</span>
          </button>
          <button class="nav-item" type="button" data-view="automation">
            <span class="nav-icon" data-icon="clock"></span>
            <span>自动化</span>
          </button>
          <button class="nav-item" type="button" data-view="audit">
            <span class="nav-icon" data-icon="shield"></span>
            <span>审计日志</span>
          </button>
          <button class="nav-item" type="button" data-view="notifications">
            <span class="nav-icon" data-icon="bell"></span>
            <span>通知中心</span>
            <span class="count" id="notif-nav-count" hidden>0</span>
          </button>
        </div>

        <button class="nav-item nav-parent" type="button" data-action="toggle-assets" id="assets-toggle">
          <span class="nav-icon" data-icon="assets"></span>
          <span>公司资产</span>
          <span class="nav-chevron">⌄</span>
        </button>
        <div class="nav-sub" id="assets-sub" hidden>
          <button class="nav-item" type="button" data-view="documents">
            <span class="nav-icon" data-icon="doc"></span>
            <span>文档管理</span>
          </button>
          <button class="nav-item" type="button" data-view="skills">
            <span class="nav-icon" data-icon="skill"></span>
            <span>技能</span>
          </button>
          <button class="nav-item" type="button" data-view="memories">
            <span class="nav-icon" data-icon="book"></span>
            <span>记忆</span>
          </button>
          <button class="nav-item" type="button" data-view="tools">
            <span class="nav-icon" data-icon="tool"></span>
            <span>工具</span>
          </button>
          <button class="nav-item" type="button" data-view="devices">
            <span class="nav-icon" data-icon="station"></span>
            <span>设备</span>
          </button>
          <button class="nav-item" type="button" data-view="experts">
            <span class="nav-icon" data-icon="expert"></span>
            <span>专家</span>
          </button>
          <button class="nav-item" type="button" data-view="data">
            <span class="nav-icon" data-icon="data"></span>
            <span>数据</span>
          </button>
          <button class="nav-item" type="button" data-view="projectfiles">
            <span class="nav-icon" data-icon="files"></span>
            <span>项目文件</span>
          </button>
          <button class="nav-item" type="button" data-view="workstations">
            <span class="nav-icon" data-icon="station"></span>
            <span>员工工位</span>
          </button>
          <button class="nav-item" type="button" data-view="templates">
            <span class="nav-icon" data-icon="template"></span>
            <span>模板市场</span>
          </button>
        </div>
      </nav>

      <div class="sidebar-section">
        <div class="section-label">
          项目
          <button class="icon-btn" type="button" data-action="new-project" title="新建项目">+</button>
        </div>
        <div class="project-list" id="sidebar-projects"></div>
      </div>

      <div class="sidebar-bottom">
        <button class="settings-entry" type="button" data-action="open-dsh">
          <span class="nav-icon" data-icon="preview"></span>
          <span>DSH 工作台</span>
        </button>
        <button class="settings-entry" type="button" data-action="open-guide">
          <span class="nav-icon" data-icon="doc"></span>
          <span>使用指南</span>
        </button>
        <button class="settings-entry" type="button" data-action="open-settings">
          <span class="nav-icon" data-icon="settings"></span>
          <span>设置</span>
        </button>
        <div class="sidebar-footer">
          <span class="app-version" id="app-version">v—</span>
          <span class="online-dot" title="本地运行"></span>
        </div>
      </div>
    </aside>

    <main class="main">
      <header class="content-header">
        <button class="mobile-menu-btn" type="button" data-action="toggle-mobile-nav" aria-label="打开导航">☰</button>
        <div class="content-heading">
          <div class="breadcrumb" id="breadcrumb">拾光工作室 / 交付物</div>
          <h1 id="view-title">交付物</h1>
        </div>
        <div class="header-right">
          <div class="search">
            <span class="search-icon" data-icon="search"></span>
            <input id="search-input" type="search" placeholder="搜索交付物、项目、员工…" autocomplete="off" />
          </div>
          <div class="run-state"><span class="dot"></span> 本地运行</div>
          <button class="bell-btn" type="button" data-action="open-notifications" title="通知中心" aria-label="通知中心">
            <span data-icon="bell"></span>
            <i class="bell-badge" id="bell-count" hidden>0</i>
          </button>
        </div>
      </header>

      <div class="model-warning-banner" id="model-warning" hidden></div>

      <section class="view" id="view"></section>

      <section class="chat-dock" id="chat-dock">
        <div class="dock-resizer" id="dock-resizer" role="separator" aria-label="拖动调整对话高度" title="拖动调整高度">
          <span></span>
        </div>
        <div class="dock-head">
          <div class="dock-left">
            <span class="dock-icon" data-icon="chat"></span>
            <span class="dock-label">对话</span>
            <select class="dock-select" id="dock-project" aria-label="选择项目"></select>
            <select class="dock-select" id="dock-employee" aria-label="选择员工"></select>
            <span class="dock-context" id="dock-context">秘书 Agent · 江叙</span>
          </div>
          <button class="dock-toggle" id="dock-toggle" type="button">收起</button>
        </div>
        <div class="dock-body" id="dock-body">
          <div class="chat-stream dock-stream" id="chat-stream"><div class="chat-flow" id="chat-flow"></div></div>
          <button class="chat-jump" id="chat-jump" type="button" data-action="chat-jump" hidden>回到最新 ↓</button>
          <div class="question-raised" id="question-raised" hidden></div>
          <div class="pending-question" id="pending-question" hidden></div>
          <form class="composer dock-composer" id="composer">
            <div class="composer-attachments" id="composer-attachments" hidden></div>
            <textarea placeholder="对秘书 Agent 说点什么，Enter 发送…" rows="1"></textarea>
            <div class="composer-foot">
              <div class="composer-tools">
                <button type="button" class="composer-tool" data-action="attach-file" title="添加文件">文件</button>
                <button type="button" class="composer-tool" data-action="attach-image" title="添加图片">图片</button>
                <button type="button" class="composer-tool" data-action="attach-screenshot" title="截图（Alt+Shift+A）">截图</button>
              </div>
              <div class="composer-model">
                <select id="composer-model" class="composer-select" aria-label="模型"></select>
                <select id="composer-effort" class="composer-select" aria-label="思考强度"></select>
              </div>
              <span class="composer-hint">Enter 发送 · Shift + Enter 换行</span>
              <button class="btn primary small" type="submit">发送</button>
            </div>
            <input type="file" id="composer-file-input" multiple hidden />
            <input type="file" id="composer-image-input" accept="image/*" multiple hidden />
          </form>
        </div>
      </section>
    </main>

    <aside class="rightbar">
      <div class="panel-tabs" id="panel-tabs">
        <button class="panel-tab active" type="button" data-panel="tasks">任务</button>
        <button class="panel-tab" type="button" data-panel="deliverables">交付</button>
        <button class="panel-tab" type="button" data-panel="employees">员工</button>
        <button class="panel-tab" type="button" data-panel="servers">服务器</button>
      </div>
      <div class="panel-body" id="panel"></div>
    </aside>
  </div>

  <div class="sidebar-overlay" id="sidebar-overlay" data-action="toggle-mobile-nav" hidden></div>

  <nav class="mobile-nav" id="mobile-nav" aria-label="移动端导航">
    <button type="button" class="mobile-nav-item active" data-mobile-view="deliverables"><span>交付</span></button>
    <button type="button" class="mobile-nav-item" data-mobile-view="tasks"><span>任务</span></button>
    <button type="button" class="mobile-nav-item" data-mobile-view="inbox"><span>收件箱</span><i class="mobile-badge" id="mobile-decision-count">2</i></button>
    <button type="button" class="mobile-nav-item" data-action="toggle-mobile-chat"><span>对话</span></button>
    <button type="button" class="mobile-nav-item" data-action="toggle-mobile-nav"><span>更多</span></button>
  </nav>

  <div id="onboarding-root" hidden></div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <div class="modal-backdrop" id="modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-head">
        <h2 id="modal-title">新建</h2>
        <button class="modal-close" type="button" data-action="close-modal" aria-label="关闭">×</button>
      </div>
      <form id="modal-form" class="modal-form">
        <div id="modal-fields"></div>
        <div class="modal-actions">
          <button class="btn ghost" type="button" data-action="close-modal">取消</button>
          <button class="btn primary" type="submit" id="modal-primary">保存</button>
        </div>
      </form>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="vendor/qrcode.js"></script>
  <script src="app.js"></script>
</body>
</html>
